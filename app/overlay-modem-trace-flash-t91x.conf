# Modem traces in the Thingy:91 X external flash, as a circular buffer that keeps the
# latest ~4 MB. Build with -DEXTRA_DTC_OVERLAY_FILE=overlay-modem-trace-flash-t91x.overlay.
# Read them back with the shell: `modem_trace stop`, `modem_trace size`, `modem_trace dump_uart`
# (UART1, captured by `nrfutil trace lte` or the Cellular Monitor), `modem_trace clear`.

CONFIG_NRF_MODEM_LIB_TRACE=y
CONFIG_NRF_MODEM_LIB_TRACE_LEVEL_LTE_AND_IP=y
CONFIG_NRF_MODEM_LIB_TRACE_BACKEND_FLASH=y
CONFIG_NRF_MODEM_TRACE_FLASH_NOSPACE_ERASE_OLDEST=y
CONFIG_NRF_MODEM_LIB_TRACE_STACK_SIZE=896
CONFIG_NRF_MODEM_LIB_TRACE_FLASH_SECTORS=1024
CONFIG_NRF_MODEM_LIB_TRACE_BACKEND_FLASH_PARTITION_SIZE=0x400000
CONFIG_NRF_MODEM_LIB_SHELL_TRACE=y

CONFIG_FCB=y
CONFIG_FLASH_MAP=y
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
