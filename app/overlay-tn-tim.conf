# TIM Brasil SIM in the physical slot, shared by the TN profile (NB-IoT on TIM)
# and the NTN profile. TIM rejects the attach without its NB-IoT APN, so the
# default PDN (CID 0, the TN profile) uses it. Apply after
# overlay-ntn-sateliot.conf, which turns the PDN defaults override off.
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="nbiot.gsim"

# The same APN on the NTN profile (CID 10).
CONFIG_APP_NTN_PDN_APN="nbiot.gsim"

# TIM accepts this SIM on NB-IoT only. With the automatic preference the modem
# first tries LTE-M on Claro and Vivo (rejected, causes 13 and 15) and once ran
# past the 180 s TN timeout before reaching TIM NB-IoT.
CONFIG_APP_NTN_TN_PREFER_NBIOT=y
