# Unattended NTN-only run: no TN leg (overlay-tn-nrfcloud.conf is NOT applied), the TLE comes
# from Kconfig and a GNSS fix + SGP4 run at boot. After each pass the module schedules the
# next one by itself from the same TLE, so the TLE ages: refresh it for long runs.
#
# Apply after overlay-ntn-sateliot.conf, plus a file with the TLE (not kept in the tree
# because it ages):
#   CONFIG_APP_NTN_TLE_NAME="SATELIOT_2"
#   CONFIG_APP_NTN_TLE_LINE1="1 ..."
#   CONFIG_APP_NTN_TLE_LINE2="2 ..."
# The SIM overlay (overlay-tn-emnify.conf or overlay-tn-tim.conf) forces the APN on the NTN
# profile (APP_NTN_PDN_APN) and on the default PDN.

CONFIG_APP_NTN_TLE_FROM_KCONFIG=y
CONFIG_APP_NTN_TRIGGER_ON_BOOT=y
