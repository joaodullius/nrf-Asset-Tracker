# TN leg for the LEO use case: boot on the terrestrial profile, connect to
# nRF Cloud over CoAP, read the TLE from the device shadow and pause the
# session before GNSS, SGP4 and the NTN pass.
#
# The shadow is filled from the PC by tle_scripts/update_tle.py. The device
# must already be onboarded to nRF Cloud, with its credentials in the modem.
#
# Apply on top of the constellation overlay, plus the SIM overlay that sets
# the terrestrial APN, for example:
#   -DEXTRA_CONF_FILE="overlay-ntn-sateliot.conf;overlay-tn-nrfcloud.conf;overlay-tn-emnify.conf"

CONFIG_APP_NTN_TN_CLOUD=y

# The NTN module drives the cloud itself; the generic ATT cloud module is not
# built in NTN mode and must not be enabled by NRF_CLOUD_COAP.
CONFIG_APP_CLOUD=n

# nRF Cloud CoAP
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_COAP=y
CONFIG_NRF_CLOUD_COAP_MAX_RETRIES=3
CONFIG_NRF_CLOUD_COAP_DISCONNECT_ON_FAILED_REQUEST=y
CONFIG_MODEM_JWT=y
CONFIG_NRF_CLOUD_PRINT_DETAILS=y
CONFIG_NRF_CLOUD_COAP_LOG_LEVEL_DBG=y

# Credentials: client ID is the modem UUID, certificates live in the modem
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_INTERNAL_UUID=y
CONFIG_NRF_CLOUD_CHECK_CREDENTIALS=y
CONFIG_NRF_CLOUD_CREDENTIALS_MGMT_MODEM=y

# CoAP client, as in the TN/NTN use case branch. Retries are left to the
# nRF Cloud CoAP transport (NRF_CLOUD_COAP_MAX_RETRIES).
CONFIG_COAP_MAX_RETRANSMIT=1
CONFIG_COAP_INIT_ACK_TIMEOUT_MS=5000
CONFIG_COAP_CLIENT_THREAD_PRIORITY=14
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_MESSAGE_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=2048
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=192
