# Extra configuration for Sateliot
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=n
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=n
CONFIG_LTE_LC_PDN_DEFAULT_APN=""

CONFIG_APP_NTN_CHANNEL_SELECT_ENABLE=y
# Norway
#CONFIG_APP_NTN_CHANNEL_SELECT=229236
# Finland/Barcelona
#CONFIG_APP_NTN_CHANNEL_SELECT=229312
# Brazil
CONFIG_APP_NTN_CHANNEL_SELECT=229232
# Australia
#CONFIG_APP_NTN_CHANNEL_SELECT=229336

# Sateliot passes above the minimum elevation can be days apart, so search a
# week ahead. Each extra day adds about 16 s of SGP4 time per satellite on the
# nRF9151 (measured 2026-10-01: 1 day in 16 s).
CONFIG_APP_SGP4_PREDICTION_WINDOW_DAYS=7

# Sateliot rejects the first attach on purpose (EMM cause 8) and accepts a new
# attach on a later pass, after the satellite has fetched the authentication
# data from the ground. See APP_NTN_TWO_STEP_ATTACH.
CONFIG_APP_NTN_TWO_STEP_ATTACH=y
