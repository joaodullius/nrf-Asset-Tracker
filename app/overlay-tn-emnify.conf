# emnify SIM in the physical slot, shared by the TN profile (LTE-M/NB-IoT on
# local operators) and the NTN profile. Sets the APN of the default PDN
# (CID 0, the TN profile). Apply after overlay-ntn-sateliot.conf, which turns
# the PDN defaults override off.
CONFIG_LTE_LC_PDN_DEFAULTS_OVERRIDE=y
CONFIG_LTE_LC_PDN_DEFAULT_FAM_IPV4=y
CONFIG_LTE_LC_PDN_DEFAULT_APN="em"
