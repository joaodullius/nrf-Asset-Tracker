# Perfil GuardianSat - site fixo em Blumenau/SC, Brasil.
# Portado de cm-hal-v.2.0.0/config/profiles/guardian_sat.conf.
#
# Aplicar POR CIMA de overlay-ntn-sateliot.conf, que e quem define a frequencia:
# ele ja traz os defaults de PDN da Sateliot, CONFIG_APP_NTN_CHANNEL_SELECT_ENABLE=y
# e o EARFCN do Brasil (229232). O canal pertence ao overlay da constelacao, entao
# nao e repetido aqui:
#
#   Push-Location C:\ncs\v3.4.0
#   C:\ncs\tools\nrfutil.exe toolchain-manager launch --ncs-version v3.4.0 -- `
#     west build --build-dir C:/work/Asset-Tracker-Template/app/build_guardiansat `
#       C:/work/Asset-Tracker-Template/app `
#       --pristine --board nrf9151dk/nrf9151/ns -- `
#       "-DEXTRA_CONF_FILE=overlay-ntn-sateliot.conf;overlay-guardiansat.conf" `
#       -Dapp_SNIPPET=nrf91-modem-trace-uart
#   Pop-Location

# --- Servidor -------------------------------------------------------------
# Endpoint UDP da GuardianSat (sobrescreve o servidor de teste do prj.conf).
CONFIG_APP_NTN_SERVER_ADDR="187.102.3.112"
CONFIG_APP_NTN_SERVER_PORT=1045

# Endpoint proprio: payload de texto simples, nao o CSV do thingy.rocks.
CONFIG_APP_NTN_THINGY_ROCKS_ENDPOINT=n

# --- TLE ------------------------------------------------------------------
# SATELIOT_4 (NORAD 60537), Celestrak, epoch 2026-08-20 18:00 UTC.
# Repetido aqui de proposito: este perfil e autocontido e pode ser fixado num
# satelite diferente do baseline do prj.conf.
# Vale ~1-2 semanas; atualizar antes de cada campanha de teste.
CONFIG_APP_NTN_TLE_FROM_KCONFIG=y
CONFIG_APP_NTN_TLE_NAME="SATELIOT_4"
CONFIG_APP_NTN_TLE_LINE1="1 60537U 24149BX  26232.75007175  .00001855  00000+0  16678-3 0  9997"
CONFIG_APP_NTN_TLE_LINE2="2 60537  97.6694 306.0053 0002879 141.3961 218.7467 14.96855742109637"

# --- Local do site --------------------------------------------------------
# Fallback usado quando o GNSS da timeout (ntn.c:1829). Sem isto o fallback
# seria Trondheim e a predicao de passagem sairia errada para o Brasil.
# Valores escalados: graus x 1e6, metros x 1e3.
CONFIG_APP_NTN_DEFAULT_LATITUDE_1000000=-26926100
CONFIG_APP_NTN_DEFAULT_LONGITUDE_1000000=-49061000
CONFIG_APP_NTN_DEFAULT_ALTITUDE_1000=15000

# --- Predicao de passagem -------------------------------------------------
# Com poucos satelites Sateliot e elevacao minima alta, o intervalo entre
# passes visiveis de Blumenau chega a ~5 dias (70 graus) e ~24 h (50 graus).
# A janela default de 1 dia falharia com "No pass found"; 7 dias cobre com
# folga. Cada dia extra custa 8640 propagacoes SGP4 por satelite no scan.
CONFIG_APP_SGP4_PREDICTION_WINDOW_DAYS=7

# --- Ciclo automatico -----------------------------------------------------
# Faz fix de GNSS + SGP4 no boot e reagenda sozinho se falhar, para a placa
# nao depender do shell em campo.
CONFIG_APP_NTN_TRIGGER_ON_BOOT=y
CONFIG_APP_NTN_TRIGGER_ON_BOOT_DELAY_SECONDS=10
CONFIG_APP_NTN_RETRY_INTERVAL_SECONDS=900
