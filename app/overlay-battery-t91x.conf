# Thingy:91 X: nPM1300 fuel gauge. The NTN module puts the battery percentage in the "battery"
# slot (field 10) of the UDP report. thingy91x_nrf9151_ns.conf turns these off for the NTN
# image; apply this overlay after it.
CONFIG_APP_POWER=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NPM13XX_CHARGER=y

# Re-enabling the UART on cable plug can hang the board (see Kconfig.power).
CONFIG_APP_POWER_DISABLE_UART_ON_VBUS_REMOVED=n

# The inspect shell is not built in NTN mode, and the power module only uses it when enabled.
CONFIG_APP_INSPECT_SHELL=n
