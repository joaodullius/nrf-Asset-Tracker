# Application log in the Thingy:91 X external flash (littlefs, /lfs1), kept across resets
# and power loss. Needs overlay-modem-trace-flash-t91x.*: the Partition Manager gives the free
# space after the trace to its external_flash partition, which ntn_log_fs.c mounts as /lfs1.
# Read it with `fs ls /lfs1` and `fs cat /lfs1/log.0000`.

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y

CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_BACKEND_FS_OVERWRITE=y
CONFIG_LOG_BACKEND_FS_APPEND_TO_NEWEST_FILE=y
CONFIG_LOG_BACKEND_FS_FILE_SIZE=32768
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=20
CONFIG_LOG_RUNTIME_FILTERING=y
